[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notice-pipeline"
version = "0.1.0"
description = "Notice collection and summarization pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "beautifulsoup4>=4.13.4,<5",
    "google-genai>=2.25.0,<3",
    "httpx>=0.28.1,<1",
    "olefile>=0.47,<1",
    "psycopg[binary]>=3.2.9,<4",
    "pydantic>=2.11.0,<3",
]

[project.scripts]
pipeline = "pipeline.cli:main"
summarize-notice = "pipeline.transform.summary_cli:main"
notice-glossary = "pipeline.glossary.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
