name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wolgye-notice/apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wolgye-notice/services/pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync
      - run: uv run ruff check
      # 테스트가 없을 때 pytest는 exit code 5를 반환한다
      - run: uv run pytest || [ $? -eq 5 ]
