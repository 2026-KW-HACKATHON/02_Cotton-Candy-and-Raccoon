name: Collect notices

on:
  # GitHub cron uses UTC. These correspond to 09:00, 13:00, 17:00 KST.
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection mode (new at 09/13, refresh at 17 KST)"
        required: true
        type: choice
        options:
          - new
          - refresh
      operation:
        description: "collect or apply the verified issue-76 DB upgrade"
        required: false
        default: collect
        type: choice
        options: [collect, migrate-ai-db]

permissions:
  contents: read

concurrency:
  group: collect-notices-production
  cancel-in-progress: false

jobs:
  collect:
    # This opt-in gate prevents writes when the workflow is first merged.
    if: vars.PIPELINE_PRODUCTION_ENABLED == 'true' && inputs.operation != 'migrate-ai-db'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --no-dev --frozen
      - name: Select collection mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 8 * * *" ]; then
            mode=refresh
          elif [ "$EVENT_NAME" = "schedule" ]; then
            mode=new
          else
            mode="$REQUESTED_MODE"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Collect Nowon notices
        id: nowon
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          NOWON_NOTICE_API_KEY: ${{ secrets.NOWON_NOTICE_API_KEY }}
        run: >-
          uv run --no-dev --frozen pipeline collect --source nowon
          --mode "${{ steps.mode.outputs.mode }}"
      - name: Collect Wolgye 1-dong notices
        id: wolgye1
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: >-
          uv run --no-dev --frozen pipeline collect --source wolgye1
          --mode "${{ steps.mode.outputs.mode }}"
      - name: Collect Seoul notices
        if: vars.PIPELINE_SEOUL_ENABLED == 'true'
        id: seoul
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          SEOUL_NEWS_API_KEY: ${{ secrets.SEOUL_NEWS_API_KEY }}
        run: >-
          uv run --no-dev --frozen pipeline collect --source seoul
          --mode "${{ steps.mode.outputs.mode }}"
      - name: Process nowon summary
        if: ${{ !cancelled() && vars.PIPELINE_AI_PROCESSING_ENABLED == 'true' }}
        id: summary_nowon
        continue-on-error: true
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required for summary." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required for summary." >&2
            exit 1
          fi
          uv run --no-dev --frozen pipeline process-stored --source nowon --feature summary --all
      - name: Process nowon easy_text
        if: ${{ !cancelled() && (vars.PIPELINE_AI_PROCESSING_ENABLED == 'true' || vars.PIPELINE_EASY_TEXT_ENABLED == 'true') }}
        id: easy_text_nowon
        continue-on-error: true
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STDICT_API_KEY: ${{ secrets.STDICT_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required for easy_text." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required for easy_text." >&2
            exit 1
          fi
          if [ -z "$STDICT_API_KEY" ]; then
            echo "STDICT_API_KEY is required for easy_text." >&2
            exit 1
          fi
          uv run --no-dev --frozen pipeline process-stored --source nowon --feature easy_text --all
      - name: Process wolgye1 summary
        if: ${{ !cancelled() && vars.PIPELINE_AI_PROCESSING_ENABLED == 'true' }}
        id: summary_wolgye1
        continue-on-error: true
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required for summary." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required for summary." >&2
            exit 1
          fi
          uv run --no-dev --frozen pipeline process-stored --source wolgye1 --feature summary --all
      - name: Process wolgye1 easy_text
        if: ${{ !cancelled() && (vars.PIPELINE_AI_PROCESSING_ENABLED == 'true' || vars.PIPELINE_EASY_TEXT_ENABLED == 'true') }}
        id: easy_text_wolgye1
        continue-on-error: true
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STDICT_API_KEY: ${{ secrets.STDICT_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required for easy_text." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required for easy_text." >&2
            exit 1
          fi
          if [ -z "$STDICT_API_KEY" ]; then
            echo "STDICT_API_KEY is required for easy_text." >&2
            exit 1
          fi
          uv run --no-dev --frozen pipeline process-stored --source wolgye1 --feature easy_text --all
      - name: Process seoul summary
        if: ${{ !cancelled() && vars.PIPELINE_AI_PROCESSING_ENABLED == 'true' && vars.PIPELINE_SEOUL_ENABLED == 'true' }}
        id: summary_seoul
        continue-on-error: true
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required for summary." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required for summary." >&2
            exit 1
          fi
          uv run --no-dev --frozen pipeline process-stored --source seoul --feature summary --all
      - name: Process seoul easy_text
        if: ${{ !cancelled() && (vars.PIPELINE_AI_PROCESSING_ENABLED == 'true' || vars.PIPELINE_EASY_TEXT_ENABLED == 'true') && vars.PIPELINE_SEOUL_ENABLED == 'true' }}
        id: easy_text_seoul
        continue-on-error: true
        timeout-minutes: 330
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STDICT_API_KEY: ${{ secrets.STDICT_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required for easy_text." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required for easy_text." >&2
            exit 1
          fi
          if [ -z "$STDICT_API_KEY" ]; then
            echo "STDICT_API_KEY is required for easy_text." >&2
            exit 1
          fi
          uv run --no-dev --frozen pipeline process-stored --source seoul --feature easy_text --all
      - name: Report collection and processing outcomes
        if: always()
        env:
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref_name }}
          RUN_EVENT: ${{ github.event_name }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          SEOUL_ENABLED: ${{ vars.PIPELINE_SEOUL_ENABLED }}
          AI_ENABLED: ${{ vars.PIPELINE_AI_PROCESSING_ENABLED }}
          EASY_ENABLED: ${{ vars.PIPELINE_EASY_TEXT_ENABLED }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          steps = json.loads(os.environ["STEP_RESULTS"])
          sources = ["nowon", "wolgye1"]
          if os.environ["SEOUL_ENABLED"] == "true":
              sources.append("seoul")
          required = list(sources)
          if os.environ["AI_ENABLED"] == "true":
              required.extend(f"summary_{source}" for source in sources)
          if os.environ["AI_ENABLED"] == "true" or os.environ["EASY_ENABLED"] == "true":
              required.extend(f"easy_text_{source}" for source in sources)
          outcomes = {name: steps.get(name, {}).get("outcome", "not_run") for name in required}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(f"Commit: `{os.environ.get('RUN_SHA', 'unknown')}`\n\n")
              report.write(f"Ref: `{os.environ.get('RUN_REF', 'unknown')}`; "
                           f"event: `{os.environ.get('RUN_EVENT', 'unknown')}`\n\n")
              report.write(f"AI enabled: {os.environ['AI_ENABLED'] == 'true'}; "
                           f"easy-text enabled: {os.environ['EASY_ENABLED'] == 'true'}; "
                           f"Seoul enabled: {os.environ['SEOUL_ENABLED'] == 'true'}; "
                           "AI jobs per source/feature: all currently eligible\n\n")
              report.write("| Stage | Outcome |\n| --- | --- |\n")
              for name, outcome in outcomes.items():
                  report.write(f"| {name} | {outcome} |\n")
              report.write("\nDisabled sources/features are excluded. JSON logs contain backlog and failure details.\n")
          print(json.dumps(outcomes))
          sys.exit(0 if all(value == "success" for value in outcomes.values()) else 1)
          PY

  migrate_ai_db:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'migrate-ai-db'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipeline_schema_test_restore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: services/pipeline
    env:
      DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
      MIGRATION_BACKUP_KEY: ${{ secrets.PIPELINE_MIGRATION_BACKUP_KEY }}
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pipeline_schema_test_restore
      PG_DUMP: /tmp/issue76-pg_dump
      PG_RESTORE: /tmp/issue76-pg_restore
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --no-dev --frozen
      - name: Use PostgreSQL 17 backup tools from the service container
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for tool in pg_dump pg_restore; do
            cat > "/tmp/issue76-$tool" <<EOF
          #!/bin/bash
          exec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE "$POSTGRES_CONTAINER" "$tool" "\$@"
          EOF
            chmod 700 "/tmp/issue76-$tool"
          done
      - name: Snapshot and encrypt before any schema writes
        run: uv run --no-dev --frozen python scripts/production_ai_migrations.py prepare --backup "$RUNNER_TEMP/issue76-backup.enc"
      - name: Verify backup can restore into disposable PostgreSQL
        run: uv run --no-dev --frozen python scripts/production_ai_migrations.py restore-check --backup "$RUNNER_TEMP/issue76-backup.enc"
      - name: Retain encrypted recovery artifact before applying
        uses: actions/upload-artifact@v4
        with:
          name: issue76-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/issue76-backup.enc
          retention-days: 30
          if-no-files-found: error
      - name: Apply missing migrations and verify before commit
        run: uv run --no-dev --frozen python scripts/production_ai_migrations.py apply --backup "$RUNNER_TEMP/issue76-backup.enc"
